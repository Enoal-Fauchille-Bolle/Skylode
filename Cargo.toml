[workspace]
resolver = "3"
members = ["crates/skylode-core", "crates/skylode-tui"]

# The fields both crates inherit rather than repeat. Cargo versions *packages*, not
# workspaces: this table is a set of defaults a member opts into with
# `key.workspace = true`, and a member that stays silent keeps its own value instead.
#
# One version for both is a claim about the product — the two crates always ship
# together, inside one binary, to one player — and it holds only for as long as that
# does. The day `skylode-core` is consumed by something other than this front-end its
# version becomes an API contract and has to move on its own; splitting then is an
# edit to this table, which is why coupling now costs nothing.
#
# `version` is read for real only by a publish or by a dependency that names it, and
# `skylode-tui` depends on the core by `path` alone — so today this number's audience
# is the release tag and the human reading it. `docs/` carries the maturity; the
# number carries the compatibility promise, and nothing else.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Enoal-Fauchille-Bolle/Skylode"

# The oldest compiler that builds this workspace — **measured, not assumed**.
#
# The edition's own floor is 1.85, and that is what this line said until it was run:
# 1.85 refuses both crates, for reasons that are unrelated to each other and equally
# real. `skylode-core` uses `u32::is_multiple_of` (stable in 1.87) and `let` chains
# (`if let Some(x) = a && …`, stable in 1.88 and only inside edition 2024).
# `skylode-tui` inherits 1.88 from `ratatui`, `time` and `darling`. The two arrive at
# the same number by coincidence, which is why one inherited value is honest here
# rather than a rounding of two different promises.
#
# It is a promise made to whoever depends on `skylode-core` once it is published, so a
# CI job compiles against exactly this toolchain: a version claimed and never exercised
# is worse than none, because cargo repeats it to a user who then meets a compiler error
# instead of a clear refusal.
rust-version = "1.88"

# Build configuration
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Clippy lints configuration
[workspace.lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "deny", priority = -2 }

complexity = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }

unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
panic = { level = "warn", priority = -1 }
todo = { level = "warn", priority = -1 }
unimplemented = { level = "warn", priority = -1 }

# Rustdoc lints configuration
#
# Public rustdoc here explains *why* an item's visibility is shaped the way it
# is, so it necessarily names `pub(crate)` items — `set_richness_setting` is
# `pub` precisely *unlike* `take` and `upgrade_size_level`. The lint's premise is
# that such a link breaks for a reader who lacks `--document-private-items`; that
# reader does not exist, because the flag is passed both locally (the `doc-all`
# alias) and on docs.rs (`package.metadata.docs.rs`). Dropping it costs nothing
# that matters: `broken_intra_doc_links` is a separate lint and stays on, so a
# renamed item is still caught.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"
