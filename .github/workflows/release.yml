# Tag in, downloadable game out.
#
# The tag is the only thing that starts a release: no manual dispatch, no push to a
# branch, nothing else. That is one rule to remember rather than several, and it
# makes the question "what shipped?" answerable with `git tag`.
#
# Versions are `vX.Y.Z`, annotated. What the three numbers promise — and why
# `SAVE_VERSION` is deliberately not one of them — is in `CONTRIBUTING.md`
# § Versioning and releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full check suite, re-run against the tagged commit.
  #
  # Chosen over trusting the CI run that already exists for this SHA, because a tag
  # can point at a commit whose CI never ran — tagging before pushing is the normal
  # way that happens — and on a public repository the re-run is free. Everything
  # below `needs:` this, so a red tag ships nothing.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS runners have been arm64 since macOS 14, so this is a native
          # build and Intel Macs are **not** covered by this matrix. Adding
          # `x86_64-apple-darwin` is a one-line matrix entry when someone asks.
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Every target here is native to its runner, so this is already installed —
      # but naming it makes the output path predictable
      # (`target/<triple>/release/`) instead of depending on whether `--target` was
      # passed, which is what the packaging steps below rely on.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p skylode-tui

      # The binary is `skylode`, not `skylode-tui`: `crates/skylode-tui/Cargo.toml`
      # declares the `[[bin]]` target explicitly to separate the package name (a
      # place in the workspace) from the name a player types. The archive carries
      # the player's name for it.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="skylode-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/skylode" "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          echo "ASSET=$stage.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "skylode-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/skylode.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The one elevated permission in either workflow, and only on the job that
      # needs it: creating the release and uploading its assets.
      contents: write
      # The two that sign the archives. Both are OIDC-shaped rather than secret-shaped:
      # `id-token` lets the runner prove who it is for the length of this job, and
      # `attestations` lets it file the resulting statement. Nothing is stored, so
      # nothing outlives the job to be stolen — which is the right answer to the worry
      # that put every action in this repository on a SHA pin.
      id-token: write
      attestations: write
    steps:
      # `fetch-depth: 0` is not optional — git-cliff reads the history to build the
      # notes, and the default shallow clone has none of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Named by prefix rather than `*`: the shell sets up the redirection and the
      # glob in an order that would otherwise let `SHA256SUMS` list itself.
      - name: Checksums
        working-directory: dist
        run: sha256sum skylode-* > SHA256SUMS

      # What `SHA256SUMS` structurally cannot say.
      #
      # That file answers *"did this download arrive intact?"* — and it is published by
      # the same account, to the same page, under the same permissions as the archives
      # it describes. Anyone able to replace a binary there is able to recompute the
      # sums, so it detects an accident and not a substitution.
      #
      # An attestation answers the other question: *which workflow, of which repository,
      # at which commit, produced this exact file.* It is signed against Sigstore's
      # public transparency log using the job's short-lived OIDC identity, so there is no
      # signing key for this repository to hold or leak, and a player checks it with
      # `gh attestation verify <archive> --repo Enoal-Fauchille-Bolle/Skylode`.
      #
      # The **archives**, not `SHA256SUMS`: the subject has to be the artifact someone
      # actually downloads and runs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/skylode-*'

      # Which body this release gets is decided **before** either producer runs.
      #
      # The first version generated first and overwrote afterwards, which cost a
      # release: `v0.1.0` has a hand-written body, so git-cliff's output was going to
      # be discarded — and git-cliff still failed the job on its way to producing it.
      # A step whose result is about to be thrown away must not be able to stop the
      # release, and the only reliable way to arrange that is not to run it.
      - name: Decide where the release body comes from
        id: notes
        run: |
          hand=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$hand" ]; then
            echo "Hand-written notes found at $hand"
            echo "hand=$hand" >> "$GITHUB_OUTPUT"
          else
            echo "No hand-written notes for ${GITHUB_REF_NAME}; generating from the commits"
          fi

      # A hand-written body is a general capability rather than a `v0.1.0` special
      # case: git-cliff emits commit subjects, and those are written for a maintainer
      # — `fix(tui): align the mine list's right-hand columns` — so any release meant
      # to be read by a player can drop a file in `.github/release-notes/`.
      #
      # `v0.1.0` is where the generated body is not merely dry but meaningless. A
      # changelog answers "what changed since the last release?", and a first release
      # has no "since": git-cliff walks back to the root commit and returns the whole
      # history, measured at 317 entries. No configuration fixes that, because a diff
      # against nothing is the project itself.
      - name: Use the hand-written notes
        if: steps.notes.outputs.hand != ''
        run: cp "${{ steps.notes.outputs.hand }}" RELEASE_NOTES.md

      # `--current` is the invocation for a tag that is already checked out: it emits
      # the notes for this tag alone rather than regenerating the whole history.
      #
      # **No `GITHUB_REPO` here, deliberately.** That variable is what switches on
      # git-cliff's GitHub integration, which then calls the REST API to enrich the
      # changelog — unauthenticated, since no token was supplied, against a limit of
      # 60 requests an hour shared across every runner on that IP. It crashed the
      # first real release. The template in `cliff.toml` uses no `github.*` value at
      # all, so the integration was paying a network dependency for nothing; without
      # the variable git-cliff reads local git history and touches no network. Adding
      # a token would have fixed the symptom and kept the dependency.
      - name: Generate the release notes
        if: steps.notes.outputs.hand == ''
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --current
        env:
          OUTPUT: RELEASE_NOTES.md

      # `generate_release_notes` stays off. GitHub builds those from **merged pull
      # requests**, and this is a solo repository committing straight to `main`, so
      # it would produce an empty list while competing with git-cliff for the same
      # field.
      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  # `skylode-core` on crates.io — the library half of what a tag ships.
  #
  # **`needs: verify`, not `needs: build`**, so this runs beside the three platform
  # builds rather than behind them. The two publications answer to different audiences
  # and neither depends on the other: a crates.io incident must not hold back binaries
  # players are waiting for, and a failed macOS build must not silently skip the crate.
  # Coupling them would only invent a shared failure they do not have.
  #
  # Only the core is published. `skylode-tui` is the product — a binary a player
  # downloads, not a crate anyone depends on — and its manifest now carries the
  # `version` on its path dependency, so publishing it is a decision rather than a
  # blocker.
  publish-crate:
    name: Publish skylode-core
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: crates.io is told, once and out of band, to trust this
      # workflow of this repository. The runner then exchanges its OIDC identity for a
      # token that lives thirty minutes. No `CARGO_REGISTRY_TOKEN` exists to be read by
      # a compromised action — the same reasoning as the attestation job above.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decided before the publishing step exists, not discovered by its failure.
      #
      # `cargo publish` refuses a version already on the registry, and re-tagging is the
      # ordinary way that happens — `v0.1.0` was re-tagged once already, and would have
      # met this. Letting a doomed step fail the job is the shape §3 of the TODO paid
      # for once; the fix there and here is the same, which is not to run it.
      - name: Decide whether this version needs publishing
        id: state
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="skylode-core") | .version')
          echo "Manifest version: $v"
          if curl -sfo /dev/null "https://crates.io/api/v1/crates/skylode-core/$v"; then
            echo "Already on crates.io; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.state.outputs.publish == 'true'
        id: auth

      - name: cargo publish
        if: steps.state.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p skylode-core
