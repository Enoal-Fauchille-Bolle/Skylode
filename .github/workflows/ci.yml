# The checks a machine runs, on every push and every pull request.
#
# This workflow exists because three gaps cannot be closed by the pre-commit hook:
#
#   1. Nothing runs the test suite. The hook has four active steps — fmt, check,
#      clippy, doc. The fifth, tarpaulin, is the one that *executed* the tests, and
#      it has been commented out since 20bbffa. `cargo check --all-targets` compiles
#      the tests without running them, so the golden save and the RNG golden vector
#      — the two tests that guard every save on disk — were verified only when a
#      human typed `cargo test`.
#   2. The hooks bypass every check on a `dev/*` branch, by design. A gate that
#      lives only in a hook does not run where the risky work happens.
#   3. `cargo build --release` is the one build nothing ever runs. The dev menu is
#      `#[cfg(debug_assertions)]` all the way down, so release compiles a different
#      tree than any local check has ever seen.
#
# Note what follows from (2): this workflow deliberately does **not** reproduce the
# `dev/*` bypass. Being the gate that branch name cannot skip is the entire point,
# and on a public repository the runner minutes are free.
name: CI

on:
  # `branches` rather than a bare `push`, which would fire on tags too — and a tag
  # already runs this whole workflow through `release.yml`'s `workflow_call`. The
  # glob matches every branch, so nothing is narrowed except the tag case.
  #
  # The one exception is Dependabot, and it is a duplicate rather than a gap. It
  # pushes its branch and *then* opens the pull request, and with both triggers
  # declared that is two runs of the same seven jobs on the same commit —
  # `concurrency` cannot collapse them, since `github.ref` is
  # `refs/heads/dependabot/…` for one and `refs/pull/N/merge` for the other. The
  # `pull_request` run is the one to keep: it is what the PR page shows and what a
  # merge is judged on. Written as a negative pattern inside `branches` rather than
  # as `branches-ignore`, which cannot be combined with an inclusion filter and
  # would have restated the tag argument above in a second, weaker form.
  #
  # Note what is deliberately *not* narrowed: every other branch still runs, `dev/*`
  # included. Being the gate a branch name cannot skip is this file's second reason
  # to exist, and a bot's branch is the only one that arrives with a PR attached.
  push:
    branches:
      - '**'
      - '!dependabot/**'
  pull_request:

  # `release.yml` calls this workflow instead of restating the check list. The
  # duplication that would otherwise happen is the exact drift the `check` job
  # below warns about between the hook and CI; a third copy would make it worse.
  workflow_call:

# A newer push makes the run in progress irrelevant — it is measuring a commit
# nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pre-commit hook, reproduced step for step and flag for flag. The point of
  # the duplication is that a green CI means exactly what a green hook means; if
  # the two drift, one of them is lying about the state of the tree.
  check:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rust-toolchain.toml` is what selects the compiler and provisions rustfmt
      # and clippy; rustup honours it on the first cargo call, so no install step
      # is needed. This prints what it resolved, which is the one thing worth
      # having in the log when a lint appears out of nowhere.
      - name: Show the resolved toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets --all-features

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `--no-deps` is correctness rather than speed, per the hook's own comment:
      # without it, `-D warnings` fails the run over a rustdoc warning inside
      # `rand`, which is not ours to fix. `--document-private-items` is what makes
      # the check see the intra-doc links to `pub(crate)` items, which is most of
      # the interesting ones in this workspace.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  # The same gate as `cargo doc` above, for the corpus that never had one.
  #
  # `broken_intra_doc_links` has kept the rustdoc honest for as long as the hook has
  # run; the markdown has been unwatched for exactly as long, and the two have drifted
  # by amounts that say so. `scripts/check-docs.sh` argues each of its four checks and
  # names what it deliberately cannot do.
  #
  # A job of its own rather than a step in `check`, for two reasons that point the same
  # way. It installs no toolchain and compiles nothing — it greps `crates/` for names —
  # so it finishes in seconds while `check` is still linking, and folding it in would
  # hide its verdict behind a four-minute compile. And a documentation finding and a
  # clippy finding are answered by different people on different days; two red dots say
  # that, one does not.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check-docs
        run: bash scripts/check-docs.sh

  # Closes gap 1. No tty is involved: `App::run` is generic over ratatui's
  # `Backend` and over the `event::Events` trait, so the tests drive the real loop
  # with a scripted event list against `TestBackend`.
  #
  # Windows is here because it is the one platform where this code genuinely
  # diverges — `ProjectDirs::from("", "", "skylode")` in `persist` resolves a
  # different directory, and crossterm has a separate backend. macOS is another
  # Unix and compiles like Linux, so it earns its place in the release matrix
  # rather than this one.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, a Windows failure cancels the Linux job and hides whether
      # the failure is platform-specific — which is the only question worth asking
      # when a matrix goes red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test
        run: cargo test --workspace --all-features

  # The MSRV in `[workspace.package]` is a promise; this is where it is kept.
  #
  # It exists because the number was wrong the first time it was written. The edition's
  # floor is 1.85, which is what a reader would assume — and 1.85 refuses both crates,
  # for unrelated reasons: the core reaches for `let` chains and `u32::is_multiple_of`,
  # the front-end inherits 1.88 from ratatui. A `rust-version` nobody compiles against
  # drifts silently upward with the first convenience anyone reaches for, and the person
  # who finds out is a stranger on an older toolchain.
  #
  # `check` and not `test`: the promise is made to whoever *builds* this crate, so it
  # covers compilation. Running the suite on an old compiler would measure the test
  # harness rather than the claim.
  #
  # And deliberately **no `-D warnings`**: rustc 1.88 reports `MARKER_TEXT_COLUMNS` in
  # `overlay/dev.rs` as dead, because its only use is inside a `const _: () = assert!(…)`
  # and that compiler's dead-code analysis does not look there. Current stable does. The
  # code is right on both; the question this job asks is whether it *compiles*, and
  # promoting an old compiler's lint gaps to errors would answer a different one.
  msrv:
    name: Build on the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read out of the manifest rather than repeated here. Written twice, the two
      # would disagree the first time one moved, and the CI would then cheerfully
      # prove a version nobody claims.
      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="skylode-core") | .rust_version')
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      # `cargo +1.88` and not a bare `cargo`: `rust-toolchain.toml` pins `stable` and
      # would otherwise win here without saying so, leaving a job that installs an old
      # compiler and then never uses it — green, and measuring nothing.
      - name: cargo check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  # Closes gap 3.
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build --release
        run: cargo build --workspace --release

  # The gate that was deliberately removed from the hook, put where it cannot be
  # skipped with a branch name and where it costs the committer nothing.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC, so no Codecov token is stored anywhere. The runner proves *which workflow
      # of which repository at which commit* it is, for the length of the job, and there
      # is nothing left afterwards for anyone to steal.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Its own cache: tarpaulin builds into `target/tarpaulin-llvm` (see
      # `tarpaulin.toml`) precisely so it does not evict the artifacts the other
      # jobs share, and a shared cache key here would undo that.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tarpaulin

      # A prebuilt binary. Compiling cargo-tarpaulin from source costs several
      # minutes per run and measures nothing.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-tarpaulin

      # `--fail-under` is the only flag that belongs here. The engine, the skipped
      # clean stage and the separate build directory live in `tarpaulin.toml`, so
      # that a hand-run `cargo tarpaulin` reports the same number this gate refuses
      # on. Two coverage figures for one repository is a bug report filed against
      # nothing.
      #
      # 94 against a workspace sitting near 99: the margin is deliberate. A gate
      # that trips on the commit adding a function, before the commit testing it,
      # is a gate that gets worked around. It refuses a collapse, not a wobble.
      # `--fail-under` and the two output formats are the only things on this line. The
      # engine, the skipped clean and the separate build directory stay in
      # `tarpaulin.toml`, so a hand-run `cargo tarpaulin` measures what this gate
      # refuses on.
      #
      # **`set -o pipefail` is the load-bearing line here, not a habit.** Without it a
      # pipeline exits with the status of its *last* command, which is `tee` and always
      # succeeds — so `--fail-under 94` would go on printing its refusal into a log
      # while the step went green. The gate would become decorative, and nothing would
      # say so.
      - name: cargo tarpaulin
        run: |
          set -o pipefail
          cargo tarpaulin --fail-under 94 --out Stdout --out Xml | tee coverage.log

      # The figure, on the run's own page.
      #
      # It is the honest half of "publish the coverage": a badge answers a stranger
      # skimming the README, this answers the person who just pushed. `always()` because
      # the number is *most* worth reading on the run where the gate refused — the step
      # above having failed is exactly when someone wants to know how far.
      - name: Report the figure
        if: always()
        run: |
          grep -E '^[0-9.]+% coverage' coverage.log >> "$GITHUB_STEP_SUMMARY" || true

      # `fail_ci_if_error: false` deliberately. The gate is `--fail-under` above, run
      # locally on the runner and answerable to nobody; Codecov is a reporter, and a
      # third party's outage must not be able to redden a build whose code is fine.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          use_oidc: true
          files: ./cobertura.xml
          fail_ci_if_error: false

  # What the 227 crates in `Cargo.lock` are allowed to be. `deny.toml` argues each
  # setting; the split is the part that belongs here.
  #
  # These three checks and **not** `advisories`. Their verdict is a function of
  # `Cargo.lock`, so it moves only when someone moves it — which is what a gate needs to
  # be true. `advisories` reads a database that changes on its own, so it lives in
  # `audit.yml` where it can report without failing an unrelated commit. That is the
  # same rule `release.yml` learned the expensive way: a step whose result cannot change
  # the outcome must not be able to stop it.
  deny:
    name: Dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same action this file already uses for tarpaulin, at the same pin. Choosing
      # it over `EmbarkStudios/cargo-deny-action` is not a preference between equals: a
      # second action is a seventh SHA to keep current, and keeping SHAs current is the
      # problem this whole section exists to solve.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny

      # No `rust-cache`: cargo-deny reads the lock file and the manifests. It compiles
      # nothing of ours, so there are no artifacts for a cache to hold.
      - name: cargo deny
        run: cargo deny check bans licenses sources
