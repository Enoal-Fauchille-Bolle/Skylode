[package]
name = "skylode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See the core's manifest for why `description` is the one field not inherited. This
# one is written for a player rather than for a caller: this package is the product,
# and its version is the number a release tag will carry.
description = "Skylode, a terminal idle mining game — the ratatui front-end and its binary"

# See the core's manifest for why each crate carries its own README rather than the
# repository's. This one matters more: it is the page a player lands on after
# `cargo install skylode-tui`, so it is written for someone about to play rather
# than for someone reading the source.
readme = "README.md"

# `terminal` and `tui` where the core has `mining` and `gamedev` — the two crates
# are found by different searches, which is the whole reason `description` is not
# inherited either.
keywords = ["game", "tui", "terminal", "idle", "incremental"]

# `games` rather than the core's `game-development`, and both are right: this half
# is the thing a player runs. `command-line-utilities` is the second, because
# `cargo install` is a real distribution channel for it and that is the shelf
# people browse for a program rather than for a library.
categories = ["games", "command-line-utilities"]

# The package keeps the `-tui` suffix, and the reason had to be rewritten once the
# decision to publish was taken.
#
# It used to be that `skylode-tui` names a *place in the workspace* while the binary
# names a *thing the player launches* — true, and resting entirely on the package name
# being private. Publishing ends that: `cargo install skylode-tui` is a player typing
# it, so the old argument now cuts the other way and would ask for a rename.
#
# The suffix survives on a different footing. **`skylode` is the whole game** — the
# rules and the front-end together — and this directory holds only the second, so
# naming it `skylode` would be a claim about its contents that is false. The
# ambiguity is Cargo's: a package is both a source unit and the unit `cargo install`
# delivers, and the two want different names here. The source tree wins, because it is
# read far more often than the install line is typed. The price is one hyphen for a
# Rust developer, and `fd-find` has charged it for years without anyone minding.
#
# The **binary** is where the whole-game name belongs, since a compiled binary really
# does contain both crates. Cargo conflates the two by default: absent this section it
# infers a binary from `src/main.rs` and hands it the package's name. Declaring the
# target explicitly is what separates them — `path` is required here, since a
# hand-written target is no longer inferred from its file.
[[bin]]
name = "skylode"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
# Both a `path` and a `version`, which is one dependency and not two: cargo follows the
# path in this workspace and would resolve the version from the registry anywhere else.
# The `path` alone is what `cargo publish` refuses — it names a directory that exists on
# no other machine — so this line is the whole of what stood between this crate and
# being publishable. It costs nothing today and is checked by nothing until that day,
# which is exactly why it is worth writing while the two numbers are still equal.
skylode-core = { path = "../skylode-core", version = "0.2.0" }

# `Config` is the `C` of `skylode_core::save::Save<C>` — the type parameter that
# carries the player's preferences through the core without the core ever learning
# what a palette is. `from_json::<C>` bounds `C` on `DeserializeOwned`, so the
# derives are not a convenience here: without them `Config` cannot cross that
# boundary at all, and `docs/SYSTEMS.md`'s "config lives in the save, there is no
# config file" has nowhere to happen.
serde = { version = "1.0", features = ["derive"] }

# The envelope that goes to disk — `{"data": "…", "mac": "…"}` — is this crate's
# format, not the core's, so the core's façade cannot write it: `save::to_json`
# produces the *payload*, and something has to wrap it. Same crate and same version
# as the core's, so this is one compilation, not two.
serde_json = "1.0"

# `HMAC-SHA256` over `data` alone (`docs/SYSTEMS.md` §Integrity). Two crates because
# the construction is two things: `sha2` is the hash, `hmac` is the keying around it.
# `hmac` also gives constant-time comparison, which costs nothing here and spares a
# hand-rolled `==` over decoded bytes.
hmac = "0.13.0"
sha2 = "0.11.0"

# The atomic write, and it is a *build* dependency rather than a dev one: writing to
# a temporary file and renaming it into place is the production path, not a testing
# convenience. `fs::rename` alone would be ten lines; what the crate buys on top is a
# unique name (two instances cannot collide) and cleanup on drop, so a write that
# never reaches its `persist` leaves nothing behind. `TempDir` then serves the tests.
tempfile = "3.27.0"

# Where the one file goes on each platform (`docs/decisions/0113`). Hand-rolling the
# lookup is ten lines on Linux and wrong on macOS and Windows, and a partial
# reimplementation of a standard is more fragile than none because it looks correct.
directories = "6.0.0"

[lints]
workspace = true
