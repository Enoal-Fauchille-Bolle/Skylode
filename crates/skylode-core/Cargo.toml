[package]
name = "skylode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `description` is not inherited: it is the one field where the two crates genuinely
# differ, and crates.io rejects an upload without it. Naming the determinism here is
# deliberate — it is the property that makes this crate worth depending on separately.
description = "Deterministic, UI-agnostic game rules for Skylode, a terminal idle mining game"

# A README of this crate's own, and not the repository's, because cargo packages a
# directory: a `readme = "../../README.md"` names a file outside it and is refused.
# Without this the crates.io page carries the description and nothing else, which is
# what `0.1.0` shipped. The two files therefore say different things on purpose —
# the root one is written for someone standing in the repository, this one for
# someone deciding whether to depend on the crate.
readme = "README.md"

# Five is the ceiling crates.io enforces, so these are the five words someone would
# plausibly search rather than a description broken into pieces. `mining` earns its
# place over `terminal`: the terminal is the front-end's property, not this crate's
# — this one compiles without one.
keywords = ["game", "gamedev", "idle", "incremental", "mining"]

# `game-development` and not `games`: this crate is not playable. Handing it the
# category a player browses would put a library in front of an audience that cannot
# use it, and hide it from the one that can.
categories = ["game-development"]

[dependencies]
# `default-features = false` drops `thread_rng` and `os_rng`, so ambient OS
# entropy is not merely unused in the core: it is not compiled in. Determinism is
# enforced by the compiler rather than by discipline. See `rng.rs`.
#
# `alloc` is what gates `rand::distr::weighted`; `unbiased` removes the residual
# bias `random_range` accepts by default (one sample in 2^96 for `u32`). The flag
# is cheap here, but it also *changes the draw sequence*, so it has to be decided
# now: turning it on later would desynchronise every existing save.
#
# `rand_chacha`'s `serde` feature is what makes the save able to store a *position
# in a sequence* rather than only the seed a run started from. It serialises the
# generator as `{seed, stream, word_pos}`, and the crate pins that shape with a
# format-stability test of its own — the same guarantee that put `ChaCha8Rng` here
# instead of `StdRng` in the first place.
rand = { version = "0.10", default-features = false, features = ["alloc", "unbiased"] }
rand_chacha = { version = "0.10", default-features = false, features = ["serde"] }

# Serialisation is not optional: a build of this game that cannot write a save is
# not a build anyone ships. Putting it behind a feature flag would double the
# `clippy`/`test` surface for a configuration nobody runs, so `serde` is a plain
# dependency and `save` is a plain module.
#
# `derive` is the macro that reads a struct's declaration at compile time and
# writes its `Serialize`/`Deserialize` for it; `serde_json` is the one format the
# save is written in (`docs/SYSTEMS.md`: one file, human-debuggable).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true

# docs.rs builds with its own flags, not the `doc-all` alias, so the choice to
# document internals has to be restated here or the published page would drop
# every link the rustdoc makes to a `pub(crate)` item. Deliberate: the rules are
# meant to be readable, and a reader who cannot see `dig` cannot follow the
# argument for why `set_richness_setting` is the one that is `pub`.
[package.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]
